# gitleaks 설정: 기본 규칙을 그대로 쓰고, terraform test(mock provider) 전용 더미 비밀번호만 예외로 둔다.
# 실제 비밀번호는 저장소에 없고 TF_VAR_redis_password / TF_VAR_db_password 로만 주입한다 (S4·⑤ 시크릿 관리).
title = "att gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "terraform/tests 의 더미 값 (TestOnly 접두사로만 허용, 다른 파일·값은 계속 탐지)"
paths = ['''^terraform/tests/policy\.tftest\.hcl$''']
regexes = ['''TestOnly[A-Za-z]+123''']
condition = "AND"

# S4 에서 추가: 실제 고객사 키 형식(att_ + 48자리 hex)을 전용 규칙으로 잡는다.
# 기본 generic-api-key 규칙은 "KEY=값" 꼴일 때만, 그리고 무작위성이 높을 때만 잡는다.
# (데모 키 demo-key-tenant-2 는 무작위성이 낮아 기본 규칙으로는 탐지되지 않았다 → S4 근본 원인 중 하나)
[[rules]]
id = "att-tenant-api-key"
description = "ATT 고객사 API 키 (att_ + 48자리 hex, rotate-tenant-key.sh 형식)"
regex = '''\batt_[0-9a-f]{48}\b'''
keywords = ["att_"]

# S4 에서 추가: 데모 키(demo-key-tenant-N)는 k6·테스트에 공개된 연습용 값이고, 고객사 2 의 데모 키는 S4 에서 폐기했다.
# 증거 파일의 curl 명령에 이 값이 찍혀 curl-auth-header 규칙이 걸리므로 이 값만 예외로 둔다.
# 실제 키(att_ + 48자리 hex)나 다른 값은 그대로 탐지된다.
[[allowlists]]
description = "공개 데모 키 (운영 키 아님)"
regexes = ['''^demo-key-tenant-[0-9]+$''']
