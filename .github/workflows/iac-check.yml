# push/PR 마다 fmt·validate·정책 테스트(mock)·정적분석·시크릿 스캔.
# Solid Cloud 는 VPN 안에서만 닿으므로 plan·apply 는 VPN 에 연결한 본인 PC 에서 사람이 확인 후 실행.
name: iac-check
on:
  push:
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: fmt
        run: terraform fmt -check -recursive

      - name: validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: policy test (terraform test + mock provider, API 키 불필요)
        run: terraform test

      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: |
          tflint --init
          tflint --format compact

      - name: checkov (기본 룰 + 사용자 정의 정책 ATT1~4)
        run: |
          pip install checkov
          checkov -d . --framework terraform \
            --external-checks-dir policies \
            --skip-path policies/tests \
            --compact

      - name: policy self-test (위반 코드가 실제로 걸러지는지)
        run: |
          if checkov -d policies/tests/bad --framework terraform \
               --external-checks-dir policies --check CKV_ATT_1,CKV_ATT_2,CKV_ATT_3,CKV_ATT_4 --compact; then
            echo "정책이 위반 코드를 통과시켰다" && exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 커밋 이력 전체 검사
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
